<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" width="1000" height="248" role="img" aria-label="Principles: client-side first, no account walls, label uncertainty, offline by default">
<defs>
  <pattern id="sl" width="3" height="3" patternUnits="userSpaceOnUse">
    <rect width="3" height="1" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <filter id="g" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="1.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="gg" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="3.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="barg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00c853"/><stop offset="1" stop-color="#00ff41"/>
  </linearGradient>
  <linearGradient id="sweepg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00ff41" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
  </linearGradient>
  
</defs>
<rect width="1000" height="248" fill="#000000"/><rect x="1" y="1" width="998" height="246" rx="10" fill="#000000" stroke="#0d7a2b" stroke-opacity="0.55" stroke-width="1.5"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0300;0.0600;0.9350;1.0000" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/><text x="62" y="56" font-family="'Courier New',Courier,monospace" font-size="16" fill="#0d7a2b" letter-spacing="1.6">cat /etc/principles</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0700;0.1000;0.9350;1.0000" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/><text x="62" y="104" font-family="'Courier New',Courier,monospace" font-size="17" fill="#ff003c" letter-spacing="1">01.</text><text x="118" y="104" font-family="'Courier New',Courier,monospace" font-size="17" fill="#00c853">If it can run on the client, it runs on the client.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1400;0.1700;0.9350;1.0000" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/><text x="62" y="140" font-family="'Courier New',Courier,monospace" font-size="17" fill="#ff003c" letter-spacing="1">02.</text><text x="118" y="140" font-family="'Courier New',Courier,monospace" font-size="17" fill="#00c853">No account walls. No API keys. No tracking pixels.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2100;0.2400;0.9350;1.0000" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/><text x="62" y="176" font-family="'Courier New',Courier,monospace" font-size="17" fill="#ff003c" letter-spacing="1">03.</text><text x="118" y="176" font-family="'Courier New',Courier,monospace" font-size="17" fill="#00c853">Uncertainty gets labelled, not hidden.</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2800;0.3100;0.9350;1.0000" dur="10.0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/><text x="62" y="212" font-family="'Courier New',Courier,monospace" font-size="17" fill="#ff003c" letter-spacing="1">04.</text><text x="118" y="212" font-family="'Courier New',Courier,monospace" font-size="17" fill="#00c853">Offline is a feature, not a fallback.</text></g>
<rect x="2" y="0" width="996" height="46" fill="url(#sweepg)"><animate attributeName="y" values="-46;248" dur="10.0s" begin="0.8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1"/></rect>
<rect width="1000" height="248" fill="url(#sl)"/>
</svg>