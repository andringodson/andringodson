<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Andrin Godson - retro CRT terminal banner">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35332e"/>
      <stop offset="0.5" stop-color="#1e1d1a"/>
      <stop offset="1" stop-color="#0e0d0c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1108"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="48%" r="72%">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <radialGradient id="bloom" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.26"/>
    </pattern>
    <filter id="glow" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-25%" y="-60%" width="150%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screenClip">
      <rect x="22" y="20" width="956" height="228" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1000" height="300" rx="22" fill="url(#bezel)"/>
  <rect x="22" y="20" width="956" height="228" rx="16" fill="url(#screen)"/>

  <g clip-path="url(#screenClip)">
    <rect x="22" y="20" width="956" height="228" fill="url(#bloom)"/>

    <text x="56" y="66" font-family="'Courier New',Courier,monospace" font-size="15" fill="#6f8f4a" letter-spacing="2">C:\&gt; RUN ANDRIN.EXE</text>

    <text x="54" y="146" font-family="'Courier New',Courier,monospace" font-size="58" font-weight="bold" fill="#ffb000" letter-spacing="7" filter="url(#glow)">ANDRIN GODSON</text>

    <text x="57" y="186" font-family="'Courier New',Courier,monospace" font-size="17" fill="#9fd45a" letter-spacing="0.6" filter="url(#softglow)">&gt; software that runs on your machine, not someone else's</text>
    <rect x="620" y="172" width="11" height="19" fill="#9fd45a">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.06s" repeatCount="indefinite"/>
    </rect>

    <line x1="56" y1="208" x2="944" y2="208" stroke="#ffb000" stroke-opacity="0.22" stroke-width="1"/>
    <text x="56" y="230" font-family="'Courier New',Courier,monospace" font-size="13" fill="#c98f2a" letter-spacing="1.6">LOC: INDIA</text>
    <text x="250" y="230" font-family="'Courier New',Courier,monospace" font-size="13" fill="#c98f2a" letter-spacing="1.6">MODE: BUILD</text>
    <text x="470" y="230" font-family="'Courier New',Courier,monospace" font-size="13" fill="#c98f2a" letter-spacing="1.6">DEPLOYS: 4 ONLINE</text>
    <text x="770" y="230" font-family="'Courier New',Courier,monospace" font-size="13" fill="#7fd07f" letter-spacing="1.6">STATUS: READY</text>

    <rect x="22" y="20" width="956" height="228" fill="url(#scanlines)"/>
    <rect x="22" y="20" width="956" height="228" fill="url(#vignette)"/>
  </g>

  <rect x="22" y="20" width="956" height="228" rx="16" fill="none" stroke="#000000" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="14" y="12" width="972" height="244" rx="20" fill="none" stroke="#4a463d" stroke-opacity="0.6" stroke-width="1.5"/>

  <circle cx="60" cy="276" r="6" fill="#7fd07f">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="78" y="281" font-family="'Courier New',Courier,monospace" font-size="12" fill="#6b675c" letter-spacing="2.4">PWR</text>
  <text x="836" y="281" font-family="'Courier New',Courier,monospace" font-size="12" fill="#6b675c" letter-spacing="2.4">MODEL GX-2026</text>
</svg>
